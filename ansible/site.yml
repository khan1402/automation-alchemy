# site.yml - the FULL setup of the infrastructure.
# Safe to run any number of times (idempotent): a second run reports changed=0.
#
#   Core only:        ansible-playbook site.yml
#   Core + bonus VMs: ansible-playbook site.yml -e enable_bonus=true
#
# Grows group by group:
#   Group 1: common
#   Group 2: hardening, firewall (cicd-server's firewall goes first, see below)
#   Group 3: docker, image build, app deploy, load balancer
#   Group 4: jenkins (configured as code with JCasC)

# Runs FIRST, before Ansible opens any SSH connection to the other VMs.
# Why: when UFW switches on, the kernel starts tracking connections. A
# connection opened BEFORE that is unknown to it, so the replies coming back
# from the other VMs look like "new" inbound traffic and get blocked. Ansible
# then waits forever. With the firewall already on here, every connection
# Ansible opens is tracked from the start and its replies are let back in.
- name: Firewall on the control node first
  hosts: cicd
  gather_facts: false
  roles:
    - firewall

- name: Baseline and security for every VM
  # 'core' = the 5 required VMs. Bonus VMs are added only when enabled,
  # so Ansible never tries to reach a VM that was not created.
  hosts: "core{{ ':backups' if enable_bonus | default(false) | bool else '' }}"
  roles:
    - common      # updates, hostname, /etc/hosts, timezone
    - hardening   # devops password + sudo, SSH, umask, auto-updates
    - firewall    # UFW: deny all, allow only what each VM needs

- name: Container runtime
  # cicd-server builds images; web + app servers run them.
  hosts: webservers:appservers:cicd
  roles:
    - docker

- name: Build and push the initial app images
  hosts: cicd
  roles:
    - image_build

- name: Deploy the application
  ansible.builtin.import_playbook: deploy.yml

- name: Load balancer
  hosts: loadbalancers
  roles:
    - loadbalancer

# Last: the app is already live, now add the CI/CD server that updates it.
- name: Jenkins CI/CD server
  hosts: cicd
  roles:
    - jenkins

