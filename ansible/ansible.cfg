# ansible.cfg - default settings, so commands stay short.
# With this file, `ansible-playbook site.yml` needs no extra flags.

[defaults]
inventory              = inventory/hosts.yml
roles_path             = roles
remote_user            = devops
private_key_file       = ~/.ssh/ansible_key
interpreter_python     = auto_silent
# Readable task output instead of raw JSON
stdout_callback        = default
callback_result_format = yaml
# Show how long each task takes (handy for the review)
callbacks_enabled      = ansible.posix.profile_tasks
retry_files_enabled    = False
# Decrypts vault.yml automatically (file copied here by bootstrap.sh, never committed)
vault_password_file    = ~/.vault_pass

[privilege_escalation]
become = True

[ssh_connection]
# accept-new: trust a VM's host key the first time, but refuse if it ever
# changes (safer than turning host key checking off completely).
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True

