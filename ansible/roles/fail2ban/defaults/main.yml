# Default values for the fail2ban role (bonus - only with -e enable_bonus=true).

# Ban an IP for 10 minutes after 5 failed SSH logins within 10 minutes.
fail2ban_bantime: 10m
fail2ban_findtime: 10m
fail2ban_maxretry: 5

# Never ban the machines that manage the VMs: cicd-server (Ansible, Jenkins)
# and the backup server. Your laptop is NOT on this list on purpose, so the
# ban can be demonstrated - see the README for how to unban it.
fail2ban_ignoreip: >-
  {{ ['127.0.0.1/8', '::1']
     + (groups['cicd'] + groups['backups']) | map('extract', hostvars, 'ansible_host') | list }}
