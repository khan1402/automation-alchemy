# Jenkins settings for this project (used by roles/jenkins).

# The pipeline job and the repository it watches.
jenkins_job_name: automation-alchemy
jenkins_git_url: https://github.com/khan1402/automation-alchemy.git
jenkins_git_branch: main

# "Track changes in Git": check for new commits every 2 minutes.
# (Polling, not a webhook: GitHub cannot reach a VM on a private network.)
jenkins_poll_schedule: "H/2 * * * *"

# Only used when the repository is private (then add vault_git_token to vault.yml).
jenkins_git_user: khan1402


